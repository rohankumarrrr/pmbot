[project]
name = "pmbot"
version = "0.1.0"
description = "Prediction-market forecasting and trading harness (Kalshi)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "numpy>=2",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=16",
    "websockets>=13",
    "pyyaml>=6",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pmbot = "pmbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmbot = ["ledger/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
