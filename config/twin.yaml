# A paper copy of the live bot: same settings and $100, no orders sent. It shows at no cost how the
# reward strategy behaves at live size, in particular how much of its estimated reward lands in
# programs that reach Kalshi's $1 payout floor. Its simulated fills are far rarer than live fills were.
#   ./scripts/run_bot.sh twin
extends: live.yaml

mode: shadow
bankroll_usd: 100
ledger_path: data/ledger_twin.sqlite

lp:
  # Live's per-market cap is 5% of what the account holds, $77.17 on 2026-11-24, so a live quote would be
  # $3.86, not $5. The twin quotes that size, so that what it shows about reaching the $1 floor holds for
  # live. Its budget stays at $60: with $22 held in positions that leaves about $38 for quotes, close to
  # live's $40 ($46 budget less $6 held).
  max_at_risk_per_quote: 3.85
  offer_out_positions: true
  enter_after_cycles: 4
  min_bid_price: 0.03
  keep_committed_while_accrued: true
  fill_prob_day: 0.18
  fill_return:
    - [0.15, -0.25]
    - [0.50, -0.35]
    - [0.85, -0.25]
    - [1.01,  0.02]
