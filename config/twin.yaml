# A paper copy of the live bot: same settings and $100, no orders sent. It shows at no cost how the
# reward strategy behaves at live size, in particular how much of its estimated reward lands in
# programs that reach Kalshi's $1 payout floor. Its simulated fills are far rarer than live fills were.
#   ./scripts/run_bot.sh twin
extends: live.yaml

mode: shadow
bankroll_usd: 100
ledger_path: data/ledger_twin.sqlite

lp:
  # Live's per-market cap is 12% of bankroll ($77.17 on 2026-11-27 -> $9.26). Twin mirrors that quote size
  # and inherits live's promoted LP settings (enter_after_cycles, min_bid_price, keep_committed_while_accrued,
  # fill_prob_day, fill_return), while keeping offer_out_positions on to continue measuring closing offers.
  max_at_risk_per_quote: 9.25
  offer_out_positions: true
