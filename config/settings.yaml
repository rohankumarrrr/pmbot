# pmbot settings. Edit here; code defaults mirror this file.

mode: shadow              # shadow = no orders, simulated fills | demo = Kalshi demo exchange | live = real money
bankroll_usd: 1000        # used in shadow and demo; live mode reads the exchange balance
ledger_path: data/ledger.sqlite

kalshi:
  # Credentials live outside the project: <credentials_dir>/<mode>/key_id (one line)
  # and <credentials_dir>/<mode>/private_key.pem, where <mode> is demo or live.
  credentials_dir: ~/.config/pmbot
  subaccount:                                # leave empty for the primary account

universe:
  exclude_categories: [Sports, Crypto, Mentions, Climate and Weather, Exotics]
  shadow_only_categories: [Politics, Elections, Financials]   # forecast and score, never trade
  mid_min: 0.15
  mid_max: 0.85
  max_spread: 0.04
  min_top_size: 20            # contracts at both best bid and best ask
  min_days_to_close: 2
  max_days_to_close: 60
  prefer_listing_age_days: 7  # newer listings rank first; not a hard cut
  max_markets_per_event: 12

forecast:
  daily_event_budget: 12
  daily_cost_cap_usd: 8.0
  max_events_per_cycle: 2     # a forecast takes ~3 minutes; keep cycles short so resting orders stay maintained
  holdout_fraction: 0.15      # share of forecast slots filled at random, bypassing the screen
  screen_model: haiku
  research_model: sonnet
  ensemble: [[opus, 2], [sonnet, 2], [haiku, 1]]
  effort: high
  min_information_edge: 1
  reforecast_after_hours: 72

trading:
  w_market: 0.67              # weight on the (bias-corrected) market price in the blend
  # Correction for how prices in these categories have resolved: win rate = sigmoid(a + b*logit(price)).
  # Fitted on 2026 trades; H2-only values used because the YES overpricing faded during the year
  # (full-year fit: a=-0.17, b=1.135). Set a=0, b=1 to switch the correction off.
  price_prior_a: -0.05
  price_prior_b: 1.10
  platt_a: 1.0                # calibration slope; identity until fitted on resolved forecasts
  platt_b: 0.0
  kelly_mult: 0.2
  max_fraction_per_market: 0.03
  max_fraction_per_cluster: 0.10
  min_edge: 0.03
  spread_edge_mult: 1.0       # edge must also exceed this x the ensemble's standard deviation
  order_ttl_hours: 12
  forecast_ttl_hours: 24
  max_mid_move: 0.03          # mid moved more than this since the forecast -> do not trade on it

lp:   # liquidity provision in markets that pay Kalshi liquidity rewards
  enabled: true
  capital_fraction: 0.6         # share of the bankroll that may sit in resting LP orders and LP inventory
  contracts_per_side: 50
  min_contracts: 10
  max_at_risk_per_quote: 30.0   # dollars lost if one quote fills and the market goes fully against it
  max_quotes: 120
  min_yield_day: 0.005          # net of expected fill losses: (reward/day + fill_prob_day x fill_return) / dollars at risk
  # What a filled resting order has returned per dollar staked, by the price paid (2026 non-sports makers).
  # Cheap bids lose most of their stake when filled; bids on the favourite make a little.
  fill_prob_day: 0.25           # chance per day that a quote fills. Measured 2026-11-17 on paper: 0.22 under 15c, 0.42 at 15-50c (20 fills); was assumed 0.10
  fill_return: [[0.15, -0.45], [0.50, -0.15], [0.85, 0.05], [1.01, 0.02]]   # [price below, return]
  min_expected_payout: 1.5      # a program pays nothing under $1 for its period
  keep_committed_while_accrued: false   # true: do not leave a program on yield while that would forfeit more than staying is expected to cost
  exclude_categories: [Sports, Crypto, Mentions]
  exclude_families: []          # ticker prefixes switched off by hand, e.g. [KXAAAGAS]; `pmbot pause KXAAAGAS` adds one while the bot runs
  min_bid_price: 0.0            # dollars; bids below this are not placed and are pulled. Paper, 5 days: 12 fills at 1c-2c cost $8.50, worth $2.00, against $3.84 of estimated rewards
  max_markets_per_family: 3     # markets quoted or held per family (first family_prefix_len letters of the series); 0 = no cap
  family_prefix_len: 8
  exchange_indexes: [0]         # exchange shards the account holds cash on; markets on others are not quoted
  min_hours_to_close: 48        # hours until the outcome is decided (the earlier of close and expected expiration)
  min_hours_left_in_program: 6
  max_day_move: 0.08            # skip markets whose price moved more than this in a day
  max_volume_24h: 2000          # contracts; busier markets mean more fills per reward dollar
  reject_cooldown_hours: 6      # after the exchange refuses an order in a market, do not quote it for this long
  requote_ticks: 2              # move an order when the reference price is this many ticks away (1 caused constant re-quoting: 79% of cancels on 2026-11-17)
  refresh_programs_minutes: 60

risk:
  max_drawdown: 0.20
  daily_loss_limit: 0.05
  max_open_orders: 120
  max_orders_per_hour: 90
  order_group_contracts_limit: 500
  order_lease_minutes: 20       # orders expire this long after the bot last renewed them (every cycle); 0 = no leases
