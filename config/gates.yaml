# Go / no-go thresholds, written down on 2026-11-16 before any forecast had resolved.
# Changing a number here after seeing results defeats the purpose; add a dated note instead.

gate0:   # shadow mode: does the forecast add anything to the market price?
  min_resolved_events: 350          # independent events, not markets or trades
  confirmation_fraction: 0.5        # later half by forecast date; tuning is allowed on the earlier half only
  pass_if:
    - blended forecast beats the market mid on Brier score in the confirmation half,
      with the 95% event-bootstrap interval for the difference entirely below zero
    - simulated profit after fees is positive on the markets the bot would trade
    - that profit stays positive with the single most profitable event removed
  stop_if:
    - the blend does not beat the price
    - the edge appears only in one event cluster or one week

gate1:   # execution plumbing on the demo exchange
  pass_if:
    - no duplicate or orphaned orders across forced restarts
    - kill switch and cancel-all verified against the exchange
    - ledger fills match exchange fills exactly

gate2:   # small live test, fixed bankroll, no top-ups
  min_fills: 100
  min_events: 50
  bankroll_usd: [250, 1000]
  pass_if:
    - trading profit after fees is at least zero
    - realised edge per contract is at least half the gate0 estimate
    - median slippage from decision price to fill price is below the minimum edge
  halt_if:
    - equity falls 20% below its peak
    - the last 100 live forecasts trail the market on Brier score

gate3:   # scaling
  rule: at most double the bankroll per quarter, and only while gate2 conditions hold on the trailing window
  also: inference cost must be under 25% of expected profit at the new bankroll

lp_live_test:   # added 2026-11-17, before any live order: is the liquidity-reward estimate real?
  bankroll_usd: 100                 # fixed, no top-ups; config/live.yaml
  duration_days: 7
  continue_if:
    - rewards Kalshi credits are at least half of the bot's estimate for the same orders and period
    - credited rewards can be withdrawn as cash
    - credited rewards exceed the loss on filled positions (marked to market) over the test
  stop_if:
    - any of the three fails
    - equity falls 20% below its peak (the bot halts itself)
    - the ledger and the exchange disagree twice in a row (the bot halts itself)
  amendments:
    # Changes made after results were seen are recorded here, not written over the rule above.
    - date: 2026-11-21
      by: Rohan
      change: drawdown stop moved from 20% to 40% below peak (halt below $60)
      why: >
        Equity was $88 after 16 hours and expected near $78 once open positions settle. The losses came from
        three filter gaps fixed the same day, and the question the test exists to answer (does Kalshi credit
        the rewards) was still open: payouts under $1 per program are not issued, and the bot had spread its
        quotes across 141 markets. Live stays paused until quotes that stick to a program are proven on paper.
    - date: 2026-11-27
      by: Rohan
      change: >
        Original 7-day test (2026-11-20 to 2026-11-27) failed ($0.00 credited vs -$26.92 trading loss; equity
        $73.08). Authorized a fresh 7-day credit-verification window (2026-11-27 to 2026-12-04) on the
        remaining $73.08 (no top-up), keeping the $60 drawdown halt (max_drawdown: 0.40), porting twin's
        promoted LP fixes (offer_out_positions kept off until demo verifies margin), and raising the live
        per-quote cap (trading.max_fraction_per_market: 0.12, trading.max_fraction_per_cluster: 0.12,
        lp.max_at_risk_per_quote: 10.0).
      baseline:
        date: 2026-11-27
        equity_usd: 73.08
        cash_usd: 70.99
        realized_pnl_usd: -22.83
        credited_usd: 0.00
        estimated_rewards_usd: 8.85
        prior_fills: 32
      why: >
        Twin's post-fix quoting reached Kalshi's $1 payout floor and trended net positive on paper (+$5.24 at
        mid over 3.9 days in >=$1 programs vs 3 fills), but Kalshi's actual credit-to-estimate ratio is still
        unmeasured ($0.00 credited because live was paused on Day 1). Raising the per-quote cap from $3.65 to
        ~$9.26 (12% of $77.17 bankroll) unblocks mid-priced markets (above 36.5c) where fill losses are less
        severe than <15c longshots. Evaluate the three continue_if rules on new credits, new estimated rewards,
        and new fill P&L from the 2026-11-27 baseline through 2026-12-04.

